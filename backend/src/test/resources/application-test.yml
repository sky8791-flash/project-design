spring:
  sql:
    init:
      # classpath:schema.sql is a reference document; Boot would otherwise run it against an embedded DB.
      mode: never
  datasource:
    # H2 keeps USER as a reserved word (MySQL does not), so the user table cannot even be created
    # until it is released — otherwise every test that touches an account dies on DDL.
    # Note this named in-memory database (DB_CLOSE_DELAY=-1) is shared by every test context, and the
    # contexts differ (MockMvc vs plain), so whichever starts last recreates the schema under
    # create-drop. Tests must therefore never assert table-wide totals or cross-class rows.
    url: jdbc:h2:mem:collabtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: test-only-secret-value-that-is-long-enough-32b
    ttl: 1h
