spring:
  sql:
    init:
      # classpath:schema.sql is a reference document; Boot would otherwise run it against an embedded DB.
      mode: never
  datasource:
    # H2 keeps USER as a reserved word (MySQL does not), so the user table cannot even be created
    # until it is released — otherwise every test that touches an account dies on DDL.
    # Three contexts share this named in-memory database today (plain @SpringBootTest, +MockMvc, and
    # +@MockBean CollabBus), each under create-drop: whichever starts last recreates the schema, and a
    # cache eviction would DROP tables another live context still uses. So keep the context count low -
    # add tests to an existing class rather than introducing a fourth configuration - and never assert
    # table-wide totals or rows created by another class.
    url: jdbc:h2:mem:collabtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: test-only-secret-value-that-is-long-enough-32b
    ttl: 1h
